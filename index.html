<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zoeger Immobilien · KI-Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f4f5f7;font-family:'IBM Plex Sans',sans-serif;color:#1a1d2e}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:4px}
input,textarea,button,select{font-family:'IBM Plex Sans',sans-serif}
input::placeholder,textarea::placeholder{color:#b0b8c8}
input:focus,textarea:focus,select:focus{outline:none;border-color:#b8943a!important;box-shadow:0 0 0 3px rgba(184,148,58,0.12)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.35s ease both}
.nav-item{transition:all 0.15s;cursor:pointer;border-radius:8px}
.nav-item:hover{background:rgba(184,148,58,0.08)!important}
.nav-item.active{background:rgba(184,148,58,0.12)!important;color:#8a6820!important}
.card{background:#fff;border:1px solid #e8edf3;border-radius:12px}
.btn-primary{background:linear-gradient(135deg,#b8943a,#8a6820);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:7px}
.btn-primary:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 4px 16px rgba(184,148,58,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-sec{background:#fff;color:#4a5568;border:1px solid #e8edf3;border-radius:8px;padding:9px 16px;font-weight:500;font-size:13px;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:7px}
.btn-sec:hover{background:#f7f8fa;border-color:#d0d5dd}
.inp{background:#fff;border:1px solid #e8edf3;border-radius:8px;padding:10px 14px;color:#1a1d2e;font-size:14px;width:100%}
.ta{background:#fff;border:1px solid #e8edf3;border-radius:8px;padding:12px 14px;color:#1a1d2e;font-size:14px;width:100%;resize:vertical;line-height:1.6}
.sel{background:#fff;border:1px solid #e8edf3;border-radius:8px;padding:10px 14px;color:#1a1d2e;font-size:14px;width:100%}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e8edf3;background:#fff;transition:all 0.15s;color:#4a5568}
.chip:hover,.chip.on{border-color:#b8943a;background:rgba(184,148,58,0.08);color:#8a6820;font-weight:600}
.res{background:#f7f8fa;border:1px solid #e8edf3;border-radius:10px;padding:16px;font-size:14px;line-height:1.8;color:#1a1d2e;white-space:pre-wrap;word-break:break-word;margin-top:16px}
.div{height:1px;background:#f0f2f5;margin:16px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const MODEL="claude-sonnet-4-20250514";
const TODAY=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

async function ai({messages,system,onText,max=1500}){
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,max_tokens:max,system,messages})});
  if(!r.ok){let m="Fehler";try{const d=await r.json();m=d.error?.message||d.error||m}catch{}throw new Error(m)}
  const d=await r.json();
  if(!d.content?.length)throw new Error("Keine Antwort");
  const t=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(onText)onText(t);return t;
}

const Spin=({s=16})=><div style={{width:s,height:s,border:"2px solid #e8edf3",borderTopColor:"#b8943a",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>;

function Res({text,loading}){
  if(!text&&!loading)return null;
  return <div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:11,fontWeight:600,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5}}>Ergebnis</span>{text&&<button className="btn-sec" onClick={()=>navigator.clipboard.writeText(text)} style={{padding:"3px 10px",fontSize:11}}>📋 Kopieren</button>}</div><div className="res">{text}{loading&&<span style={{display:"inline-block",width:7,height:13,background:"#b8943a",marginLeft:3,animation:"pulse .8s infinite",verticalAlign:"middle",borderRadius:1}}/>}</div></div>;
}

function Card({children,s={}}){return<div className="card fade-up"style={{padding:24,...s}}>{children}</div>}
function Lbl({t}){return<label style={{fontSize:12,fontWeight:600,color:"#8a95a8",display:"block",marginBottom:4}}>{t}</label>}
function SH({title,sub}){return<div style={{marginBottom:24}}><h2 style={{fontSize:20,fontWeight:700,fontFamily:"'Playfair Display',serif"}}>{title}</h2>{sub&&<p style={{fontSize:13,color:"#8a95a8",marginTop:4}}>{sub}</p>}</div>}

function Tabs({modes,mode,setMode}){
  return<div style={{display:"flex",gap:8,marginBottom:24,flexWrap:"wrap"}}>{modes.map(m=><button key={m.id} className={`chip${mode===m.id?" on":""}`} onClick={()=>setMode(m.id)}>{m.icon} {m.label}</button>)}</div>;
}

// OBJEKTE
function ObjekteView(){
  const [mode,setMode]=useState("expose");
  return<div><SH title="Objekte" sub="Exposés, Texte und Preisbewertungen in Sekunden"/><Tabs modes={[{id:"expose",icon:"📝",label:"Exposé"},{id:"kanal",icon:"📢",label:"Kanal-Anpassung"},{id:"preis",icon:"💶",label:"Preisbewertung"},{id:"titel",icon:"✨",label:"Titel & Slogan"}]} mode={mode} setMode={setMode}/>{mode==="expose"&&<ExposeGen/>}{mode==="kanal"&&<KanalGen/>}{mode==="preis"&&<PreisGen/>}{mode==="titel"&&<TitelGen/>}</div>;
}

function ExposeGen(){
  const [f,setF]=useState({typ:"Eigentumswohnung",lage:"",zimmer:"",flaeche:"",preis:"",baujahr:"",besonderheiten:"",ziel:"Kapitalanleger"});
  const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Erstelle hochwertiges Immobilien-Exposé:\nTyp: ${f.typ} | Lage: ${f.lage} | Zimmer: ${f.zimmer} | Fläche: ${f.flaeche}m² | Preis: ${f.preis}€ | Baujahr: ${f.baujahr} | Zielgruppe: ${f.ziel}\nBesonderheiten: ${f.besonderheiten}\n\nStruktur: Überschrift → Einleitung (emotional) → Beschreibung → Lage → Ausstattung → Fazit & CTA. Professionell, werthaltig, kein Marketingsprech.`}],system:"Erfahrener Immobilienmarketer. Hochwertige Exposé-Texte auf Deutsch.",onText:t=>setRes(t),max:1800})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
    <div><Lbl t="OBJEKTTYP"/><select className="sel" value={f.typ} onChange={e=>setF({...f,typ:e.target.value})}>{["Eigentumswohnung","Einfamilienhaus","Mehrfamilienhaus","Doppelhaushälfte","Reihenhaus","Grundstück"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="LAGE"/><input className="inp" value={f.lage} onChange={e=>setF({...f,lage:e.target.value})} placeholder="z.B. Hamm-Heessen, ruhige Lage"/></div>
    <div><Lbl t="ZIMMER"/><input className="inp" value={f.zimmer} onChange={e=>setF({...f,zimmer:e.target.value})} placeholder="z.B. 3"/></div>
    <div><Lbl t="FLÄCHE (m²)"/><input className="inp" value={f.flaeche} onChange={e=>setF({...f,flaeche:e.target.value})} placeholder="z.B. 85"/></div>
    <div><Lbl t="KAUFPREIS (€)"/><input className="inp" value={f.preis} onChange={e=>setF({...f,preis:e.target.value})} placeholder="z.B. 235.000"/></div>
    <div><Lbl t="BAUJAHR"/><input className="inp" value={f.baujahr} onChange={e=>setF({...f,baujahr:e.target.value})} placeholder="z.B. 1985"/></div>
    <div><Lbl t="ZIELGRUPPE"/><select className="sel" value={f.ziel} onChange={e=>setF({...f,ziel:e.target.value})}>{["Kapitalanleger","Eigennutzer","Familie","Erstkäufer","Senioren"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="BESONDERHEITEN"/><input className="inp" value={f.besonderheiten} onChange={e=>setF({...f,besonderheiten:e.target.value})} placeholder="z.B. Tiefgarage, Balkon, saniert"/></div>
  </div><button className="btn-primary" onClick={go} disabled={load||!f.lage}>{load?<><Spin s={13}/>Generiere…</>:"✨ Exposé erstellen"}</button><Res text={res} loading={load}/></Card>;
}

function KanalGen(){
  const [expose,setExpose]=useState("");const [kanal,setKanal]=useState("ImmobilienScout24");const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const kanaele=["ImmobilienScout24","Immowelt","Website","Instagram","Facebook","Newsletter","Flyer"];
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Passe diesen Exposétext optimal für "${kanal}" an:\n\n${expose}`}],system:"Immobilien-Marketing-Experte. Texte kanalgerecht anpassen.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{marginBottom:12}}><Lbl t="ZIELKANAL"/><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{kanaele.map(k=><button key={k} className={`chip${kanal===k?" on":""}`} onClick={()=>setKanal(k)}>{k}</button>)}</div></div><div style={{marginBottom:12}}><Lbl t="ORIGINAL EXPOSÉTEXT"/><textarea className="ta" rows={5} value={expose} onChange={e=>setExpose(e.target.value)} placeholder="Exposétext einfügen…"/></div><button className="btn-primary" onClick={go} disabled={load||!expose.trim()}>{load?<><Spin s={13}/>Anpassen…</>:"📢 Für Kanal anpassen"}</button><Res text={res} loading={load}/></Card>;
}

function PreisGen(){
  const [f,setF]=useState({typ:"Eigentumswohnung",lage:"",zimmer:"",flaeche:"",baujahr:"",zustand:"gut",preis:""});const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Preisbewertung: ${f.typ} in ${f.lage}, ${f.zimmer} Zi., ${f.flaeche}m², Bj.${f.baujahr}, Zustand: ${f.zustand}. Angefragter Preis: ${f.preis}€.\nEinschätzung: realistisch/zu hoch/zu niedrig, Vergleichswerte NRW/Hamm, Verhandlungsempfehlung.`}],system:"Immobiliengutachter NRW/Hamm. Ehrliche, fundierte Preiseinschätzungen.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
    <div><Lbl t="TYP"/><select className="sel" value={f.typ} onChange={e=>setF({...f,typ:e.target.value})}>{["Eigentumswohnung","Einfamilienhaus","Mehrfamilienhaus","Doppelhaushälfte"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="LAGE"/><input className="inp" value={f.lage} onChange={e=>setF({...f,lage:e.target.value})} placeholder="z.B. Hamm-Heessen"/></div>
    <div><Lbl t="ZIMMER"/><input className="inp" value={f.zimmer} onChange={e=>setF({...f,zimmer:e.target.value})} placeholder="3"/></div>
    <div><Lbl t="FLÄCHE (m²)"/><input className="inp" value={f.flaeche} onChange={e=>setF({...f,flaeche:e.target.value})} placeholder="85"/></div>
    <div><Lbl t="BAUJAHR"/><input className="inp" value={f.baujahr} onChange={e=>setF({...f,baujahr:e.target.value})} placeholder="1990"/></div>
    <div><Lbl t="ZUSTAND"/><select className="sel" value={f.zustand} onChange={e=>setF({...f,zustand:e.target.value})}>{["sehr gut","gut","mittel","renovierungsbedürftig"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div style={{gridColumn:"1/-1"}}><Lbl t="ANGEFRAGTER PREIS (€)"/><input className="inp" value={f.preis} onChange={e=>setF({...f,preis:e.target.value})} placeholder="235000"/></div>
  </div><button className="btn-primary" onClick={go} disabled={load||!f.lage||!f.preis}>{load?<><Spin s={13}/>Bewerte…</>:"💶 Preis bewerten"}</button><Res text={res} loading={load}/></Card>;
}

function TitelGen(){
  const [txt,setTxt]=useState("");const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`5 Titel-Varianten + Slogans für:\n${txt}\n\nJe: Titel (max 80 Z.) + Slogan (max 120 Z.). Tonalitäten: emotional, sachlich, exklusiv, familienorientiert, investitionsorientiert.`}],system:"Immobilien-Texter. Packende, klickstarke Überschriften.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><Lbl t="OBJEKT (STICHPUNKTE)"/><textarea className="ta" rows={3} value={txt} onChange={e=>setTxt(e.target.value)} placeholder="z.B. 3 Zi. ETW, 78m², Hamm-Werries, Balkon, Tiefgarage, Bj.1995, kernsaniert 2020"/><div style={{marginTop:12}}><button className="btn-primary" onClick={go} disabled={load||!txt.trim()}>{load?<><Spin s={13}/>Generiere…</>:"✨ Titel erstellen"}</button></div><Res text={res} loading={load}/></Card>;
}

// ANFRAGEN
function AnfragenView(){
  const [mode,setMode]=useState("prio");
  return<div><SH title="Anfragen" sub="Kaufbereitschaft prüfen, antworten, nachfassen"/><Tabs modes={[{id:"prio",icon:"🎯",label:"Kaufbereitschaft"},{id:"antwort",icon:"✉️",label:"Antwort"},{id:"nachfass",icon:"🔄",label:"Nachfassen"},{id:"absage",icon:"🤝",label:"Absage"}]} mode={mode} setMode={setMode}/>{mode==="prio"&&<KaufCheck/>}{mode==="antwort"&&<AntwortGen/>}{mode==="nachfass"&&<NachfassGen/>}{mode==="absage"&&<AbsageGen/>}</div>;
}

function KaufCheck(){
  const [a,setA]=useState("");const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Analysiere diese Immobilienanfrage:\n"${a}"\n\n1) Kaufbereitschaft (HOCH/MITTEL/NIEDRIG) mit Begründung\n2) Positive/negative Signale\n3) Empfohlene nächste Schritte\n4) Mögliche Einwände`}],system:"Erfahrener Immobilienmakler. Kaufanfragen präzise analysieren.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><Lbl t="ANFRAGE-TEXT"/><textarea className="ta" rows={5} value={a} onChange={e=>setA(e.target.value)} placeholder="Anfrage aus E-Mail, IS24, Immowelt etc. einfügen…"/><div style={{marginTop:12}}><button className="btn-primary" onClick={go} disabled={load||!a.trim()}>{load?<><Spin s={13}/>Analysiere…</>:"🎯 Kaufbereitschaft prüfen"}</button></div><Res text={res} loading={load}/></Card>;
}

function AntwortGen(){
  const [f,setF]=useState({anfrage:"",objekt:"",ton:"professionell-freundlich",ziel:"Besichtigung vereinbaren"});const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Antwort auf: "${f.anfrage}"\nObjekt: ${f.objekt} | Ton: ${f.ton} | Ziel: ${f.ziel}\nVon: Philipp / Zoeger Immobilien Hamm`}],system:"Immobilienmakler Zoeger Immobilien Hamm. Professionelle, persönliche Antworten.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
    <div style={{gridColumn:"1/-1"}}><Lbl t="ORIGINAL-ANFRAGE"/><textarea className="ta" rows={3} value={f.anfrage} onChange={e=>setF({...f,anfrage:e.target.value})} placeholder="Anfrage des Interessenten…"/></div>
    <div><Lbl t="OBJEKT"/><input className="inp" value={f.objekt} onChange={e=>setF({...f,objekt:e.target.value})} placeholder="z.B. 3 Zi. ETW Hamm"/></div>
    <div><Lbl t="TON"/><select className="sel" value={f.ton} onChange={e=>setF({...f,ton:e.target.value})}>{["professionell-freundlich","persönlich-warm","sachlich-direkt","exklusiv-beratend"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="ZIEL"/><select className="sel" value={f.ziel} onChange={e=>setF({...f,ziel:e.target.value})}>{["Besichtigung vereinbaren","Mehr Infos erfragen","Telefonat vorschlagen","Kaufinteresse qualifizieren"].map(t=><option key={t}>{t}</option>)}</select></div>
  </div><button className="btn-primary" onClick={go} disabled={load||!f.anfrage.trim()}>{load?<><Spin s={13}/>Schreibe…</>:"✉️ Antwort generieren"}</button><Res text={res} loading={load}/></Card>;
}

function NachfassGen(){
  const [f,setF]=useState({name:"",objekt:"",kontakt:"Besichtigung",tage:"7",info:""});const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Nachfass-Mail an ${f.name} | Objekt: ${f.objekt} | Letzter Kontakt: ${f.kontakt} vor ${f.tage} Tagen${f.info?" | "+f.info:""}\nFreundlich nachfassen, Interesse wecken, nächsten Schritt vorschlagen. Von Philipp / Zoeger Immobilien Hamm.`}],system:"Immobilienmakler. Freundliche, nicht aufdringliche Nachfass-Mails.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
    <div><Lbl t="NAME"/><input className="inp" value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="z.B. Familie Müller"/></div>
    <div><Lbl t="OBJEKT"/><input className="inp" value={f.objekt} onChange={e=>setF({...f,objekt:e.target.value})} placeholder="z.B. EFH Heessen"/></div>
    <div><Lbl t="LETZTER KONTAKT"/><select className="sel" value={f.kontakt} onChange={e=>setF({...f,kontakt:e.target.value})}>{["Besichtigung","Erstkontakt","Telefonat","Exposé-Versand"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="VOR X TAGEN"/><input className="inp" value={f.tage} onChange={e=>setF({...f,tage:e.target.value})} placeholder="7"/></div>
    <div style={{gridColumn:"1/-1"}}><Lbl t="KONTEXT (OPTIONAL)"/><input className="inp" value={f.info} onChange={e=>setF({...f,info:e.target.value})} placeholder="z.B. hatte Bedenken wegen Renovierungsbedarf"/></div>
  </div><button className="btn-primary" onClick={go} disabled={load||!f.name||!f.objekt}>{load?<><Spin s={13}/>Schreibe…</>:"🔄 Nachfass-Mail"}</button><Res text={res} loading={load}/></Card>;
}

function AbsageGen(){
  const [f,setF]=useState({name:"",grund:"anderes Objekt gefunden",ton:"warm-professionell"});const [res,setRes]=useState("");const [load,setLoad]=useState(false);
  const go=async()=>{setLoad(true);setRes("");try{await ai({messages:[{role:"user",content:`Absage an ${f.name}. Grund: ${f.grund}. Ton: ${f.ton}. Wertschätzend, Tür offenhalten. Von Philipp / Zoeger Immobilien Hamm.`}],system:"Immobilienmakler. Absagen die positive Beziehung erhalten.",onText:t=>setRes(t)})}catch(e){setRes("⚠️ "+e.message)}setLoad(false)};
  return<Card><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
    <div><Lbl t="NAME"/><input className="inp" value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="z.B. Herr Schmidt"/></div>
    <div><Lbl t="GRUND"/><select className="sel" value={f.grund} onChange={e=>setF({...f,grund:e.target.value})}>{["anderes Objekt gefunden","Objekt bereits verkauft","kein Interesse mehr","Finanzierung gescheitert","Preis zu hoch"].map(t=><option key={t}>{t}</option>)}</select></div>
    <div><Lbl t="TON"/><select className="sel" value={f.ton} onChange={e=>setF({...f,ton:e.target.value})}>{["warm-professionell","sachlich-kurz","empathisch-persönlich"].map(t=><option key={t}>{t}</option>)}</select></div>
  </div><button className="btn-primary" onClick={go} disabled={load||!f.name}>{load?<><Spin s={13}/>Schreibe…</>:"🤝 Absage verfassen"}</button><Res text={res} loading={load}/></Card>;
}

// MARKT
function MarktView(){
  const [sections,setSections]=useState({});const [active,setActive]=useState(null);
  const topics=[
    {key:"zinsen",icon:"📈",label:"Bauzinsen & EZB",p:"Aktuelle Zinssituation Immobilienfinanzierung Deutschland: Bauzins 10/15/20J, EZB-Tendenz, 6-Monats-Prognose. Konkrete Zahlen für Maklerberatung."},
    {key:"hamm",icon:"🏘️",label:"Markt Hamm & NRW",p:"Immobilienmarkt Hamm NRW: Preisniveau ETW/EFH, Trends, Angebot vs. Nachfrage, Vermarktungsdauer, lokale Besonderheiten. Praxistipps für Makler."},
    {key:"de",icon:"🇩🇪",label:"Deutschland",p:"Nationaler Immobilienmarkt: Preistrends, A/B/C-Städte vs. Umland, Kauf vs. Miete, Transaktionsvolumen, für Kapitalanlegerberatung."},

function Aufgaben(){
  const [tasks,setTasks]=useState([{id:1,text:"KfW-Antrag Z-04531 prüfen",prio:"hoch",done:false},{id:2,text:"Besichtigung EFH Heessen vorbereiten",prio:"hoch",done:false},{id:3,text:"Exposé Tulpenstraße überarbeiten",prio:"mittel",done:false},{id:4,text:"Newsletter Mai versenden",prio:"mittel",done:false}]);
  const [inp,setInp]=useState("");const [plan,setPlan]=useState("");const [pl,setPl]=useState(false);
  const add=()=>{if(!inp.trim())return;setTasks(t=>[...t,{id:Date.now(),text:inp.trim(),prio:"mittel",done:false}]);setInp("")};
  const tog=id=>setTasks(t=>t.map(x=>x.id===id?{...x,done:!x.done}:x));
  const rem=id=>setTasks(t=>t.filter(x=>x.id!==id));
  const cyc=id=>{const p=["hoch","mittel","niedrig"];setTasks(t=>t.map(x=>x.id===id?{...x,prio:p[(p.indexOf(x.prio)+1)%3]}:x))};
  const mkPlan=async()=>{setPl(true);setPlan("");const l=tasks.filter(t=>!t.done).map(t=>`- ${t.text} [${t.prio}]`).join("\n");try{await ai({messages:[{role:"user",content:`Tagesplan für Immobilienmakler:\n${l}\nMit Zeitblöcken und Prioritätsbegründung.`}],system:"Produktivitäts-Coach für Immobilienmakler.",onText:t=>setPlan(t)})}catch(e){setPlan("⚠️ "+e.message)}setPl(false)};
  const pc={hoch:"#dc2626",mittel:"#b8943a",niedrig:"#16a34a"};
  const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  return<div style={{display:"flex",flexDirection:"column",gap:16}}>
    <Card><div style={{display:"flex",gap:8,marginBottom:16}}><input className="inp" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Neue Aufgabe…"/><button className="btn-primary" onClick={add}>+ Hinzufügen</button></div>
      {open.length>0&&<><div style={{fontSize:11,fontWeight:600,color:"#8a95a8",marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Offen ({open.length})</div>
      {open.map((t,i)=><div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<open.length-1?"1px solid #f0f2f5":"none"}}>
        <div onClick={()=>tog(t.id)} style={{width:18,height:18,borderRadius:5,border:"2px solid #d0d5dd",cursor:"pointer",flexShrink:0}} onMouseEnter={e=>e.currentTarget.style.borderColor="#b8943a"} onMouseLeave={e=>e.currentTarget.style.borderColor="#d0d5dd"}/>
        <span style={{flex:1,fontSize:14}}>{t.text}</span>
        <span onClick={()=>cyc(t.id)} style={{fontSize:10,fontWeight:600,color:pc[t.prio],cursor:"pointer",padding:"2px 8px",border:`1px solid ${pc[t.prio]}30`,borderRadius:10}}>{t.prio}</span>
        <button onClick={()=>rem(t.id)} style={{background:"none",border:"none",color:"#b0b8c8",cursor:"pointer",fontSize:18,lineHeight:1}}>×</button>
      </div>)}</>}
      {open.length>0&&<button className="btn-primary" onClick={mkPlan} disabled={pl} style={{marginTop:16}}>{pl?<><Spin s={13}/>Plane…</>:"🤖 KI-Tagesplan"}</button>}
      {done.length>0&&<><div className="div"/><div style={{fontSize:11,fontWeight:600,color:"#8a95a8",marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Erledigt ({done.length})</div>{done.map(t=><div key={t.id} onClick={()=>tog(t.id)} style={{fontSize:13,color:"#b0b8c8",textDecoration:"line-through",cursor:"pointer",padding:"4px 0"}}>{t.text}</div>)}</>}
    </Card>
    {plan&&<Card><div style={{fontSize:12,fontWeight:600,color:"#8a95a8",marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>KI-Tagesplan</div><div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{plan}{pl&&<span style={{display:"inline-block",width:7,height:13,background:"#b8943a",marginLeft:3,animation:"pulse .8s infinite",verticalAlign:"middle",borderRadius:1}}/>}</div></Card>}
  </div>;
}

// Helper: Backend-Daten laden
async function backendFetch(path, params){
  const q=params?("?"+new URLSearchParams(params).toString()):"";
  const r=await fetch("/api/backend/"+path+q);
  const d=await r.json();
  if(!d.success)throw new Error(d.errorMsg||d.error||"Fehler");
  return d;
}

// Status Badge
function StatusBadge({status}){
  const cfg={
    aktiv:{bg:"#dcfce7",c:"#166534",label:"Aktiv"},
    reserviert:{bg:"#fef9c3",c:"#854d0e",label:"Reserviert"},
    verkauft:{bg:"#f1f5f9",c:"#475569",label:"Verkauft"},
    vermietet:{bg:"#f1f5f9",c:"#475569",label:"Vermietet"},
    inaktiv:{bg:"#fee2e2",c:"#991b1b",label:"Inaktiv"},
    offen:{bg:"#dbeafe",c:"#1d4ed8",label:"Offen"},
    beantwortet:{bg:"#dcfce7",c:"#166534",label:"Beantwortet"},
    besichtigung:{bg:"#fef9c3",c:"#854d0e",label:"Besichtigung"},
    abgesagt:{bg:"#fee2e2",c:"#991b1b",label:"Abgesagt"},
    gekauft:{bg:"#d1fae5",c:"#065f46",label:"Gekauft"},
  };
  const s=cfg[status]||{bg:"#f1f5f9",c:"#475569",label:status};
  return<span style={{background:s.bg,color:s.c,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,letterSpacing:.3}}>{s.label}</span>;
}

function daysSince(iso){
  if(!iso)return null;
  const d=Math.floor((Date.now()-new Date(iso))/86400000);
  return d;
}

function DaysBadge({iso,label}){
  if(!iso)return<span style={{color:"#b0b8c8",fontSize:11}}>–</span>;
  const d=daysSince(iso);
  const color=d>14?"#dc2626":d>7?"#d48f00":"#16a34a";
  return<span style={{color,fontSize:11,fontWeight:600}}>{d}d ago</span>;
}

function fmt(n){
  if(!n)return"–";
  return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
}

  useEffect(()=>{fetchData()},[]);
  const fetchData=async()=>{
    setLoad(true);
    try{const d=await backendFetch("realestates");setData(d);}
    catch(e){setData({error:e.message});}
    setLoad(false);
  };

    setLoad(true);

        <span style={{fontSize:11,fontWeight:600,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5}}>Status:</span>

// ANRUF-LISTE
function AnrufListe(){
  const [state,setState]=useState("idle");const [result,setResult]=useState(null);

  const analyse=async()=>{
    setState("loading");
    try{
      const r=await fetch("/api/anruf-analyse");
      const d=await r.json();
      if(!d.success)throw new Error(d.error);
      setResult(d); setState("done");
    }catch(e){setState("error:"+e.message);}
  };

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {state==="idle"&&(
        <Card s={{textAlign:"center",padding:"48px 24px"}}>
          <div style={{fontSize:40,marginBottom:16}}>📞</div>
          <div style={{fontSize:15,fontWeight:600,color:"#1a1d2e",marginBottom:8}}>KI-Anruf-Analyse</div>
          <div style={{fontSize:13,color:"#8a95a8",marginBottom:8}}>Analysiert alle Kontakte und offenen Anfragen</div>
          <div style={{fontSize:12,color:"#b0b8c8",marginBottom:24}}>Erkennt Mehrfachanfrager, dringende Fälle und priorisiert deinen Tages-Anrufplan</div>
          <button className="btn-primary" onClick={analyse} style={{padding:"12px 32px"}}>📞 Anruf-Liste erstellen</button>
        </Card>
      )}
      {state==="loading"&&(
        <Card s={{textAlign:"center",padding:"48px"}}>
          <Spin s={28}/>
          <div style={{color:"#8a95a8",marginTop:12,fontSize:13}}>Analysiere Kontakte und Anfragen…</div>
          <div style={{color:"#b0b8c8",marginTop:6,fontSize:11}}>Dauert ca. 15–30 Sekunden</div>
        </Card>
      )}
      {state.startsWith("error:")&&(
        <Card s={{textAlign:"center",padding:"40px"}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:14,color:"#dc2626",marginBottom:16}}>{state.replace("error:","")}</div>
          <button className="btn-primary" onClick={analyse}>Erneut versuchen</button>
        </Card>
      )}
      {state==="done"&&result&&(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Card s={{padding:"14px",textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:4}}>👥</div>
              <div style={{fontSize:22,fontWeight:700,color:"#b8943a"}}>{result.contactCount}</div>
              <div style={{fontSize:10,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5}}>Kontakte gesamt</div>
            </Card>
            <Card s={{padding:"14px",textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:4}}>📬</div>
              <div style={{fontSize:22,fontWeight:700,color:"#dc2626"}}>{result.openCount}</div>
              <div style={{fontSize:10,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5}}>Offene Anfragen</div>
            </Card>
          </div>
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <span style={{fontWeight:700,fontSize:14,color:"#1a1d2e"}}>📞 Deine Anruf-Liste für heute</span>
              <button className="btn-sec" onClick={()=>setState("idle")} style={{fontSize:11,padding:"4px 12px"}}>Neu analysieren</button>
            </div>
            <div style={{fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",color:"#1a1d2e"}}>{result.analysis}</div>
          </Card>
        </div>
      )}
    </div>
  );
}

// INTERESSENTEN
function InteressentenBackend(){
  const [data,setData]=useState(null);const [load,setLoad]=useState(false);const [search,setSearch]=useState("");

  useEffect(()=>{
    (async()=>{
      setLoad(true);
      try{const d=await backendFetch("contacts");setData(d);}
      catch(e){setData({error:e.message});}
      setLoad(false);
    })();
  },[]);

  if(load)return<Card s={{textAlign:"center",padding:"48px"}}><Spin s={28}/><div style={{color:"#8a95a8",marginTop:12,fontSize:13}}>Lade Interessenten…</div></Card>;
  if(!data)return null;
  if(data.error)return<Card s={{textAlign:"center",padding:"40px"}}><div style={{color:"#dc2626"}}>⚠️ {data.error}</div></Card>;

  const items=(data.data||[]).filter(c=>!search||c.name?.toLowerCase().includes(search.toLowerCase())||c.email?.toLowerCase().includes(search.toLowerCase()));

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <input className="inp" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suche nach Name oder E-Mail…" style={{maxWidth:320}}/>
        <span style={{fontSize:12,color:"#8a95a8",marginLeft:"auto"}}>{items.length} von {data.count} Interessenten</span>
      </div>

      <div style={{borderRadius:12,overflow:"hidden",border:"1px solid #e8edf3"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 140px 100px 90px 90px",background:"#f4f5f7",padding:"9px 16px",borderBottom:"2px solid #b8943a"}}>
          {["Name & Kontakt","Erstkontakt","Letzter","Anfragen",""].map(h=><div key={h} style={{fontSize:10,fontWeight:700,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.8}}>{h}</div>)}
        </div>
        {items.map((c,i)=>(
          <div key={c.contact_id} style={{display:"grid",gridTemplateColumns:"1fr 140px 100px 90px 90px",padding:"12px 16px",background:i%2===0?"#fff":"#f9fafb",borderBottom:"1px solid #f0f2f5",borderLeft:c.inquiry_count>2?"3px solid #b8943a":"3px solid transparent",alignItems:"center",transition:"background .15s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#fdf8ef"}
            onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"#fff":"#f9fafb"}>
            <div>
              {c.inquiry_count>2&&<span style={{background:"rgba(184,148,58,.12)",color:"#b8943a",fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:8,marginRight:5}}>MEHRFACH</span>}
              <div style={{fontSize:13,fontWeight:600,color:"#1a1d2e"}}>{c.name}</div>
              <div style={{fontSize:11,color:"#8a95a8"}}>{c.phone||c.mobile||c.email||"–"}</div>
            </div>
            <div style={{fontSize:11,color:"#64748b"}}>{c.first_inquiry_at?new Date(c.first_inquiry_at).toLocaleDateString("de-DE"):"–"}</div>
            <div><DaysBadge iso={c.last_inquiry_at}/></div>
            <div style={{fontSize:14,fontWeight:700,color:c.inquiry_count>2?"#b8943a":"#1a1d2e"}}>{c.inquiry_count}×</div>
            <div>
              <button onClick={async()=>{
                try{
                  const d=await backendFetch("contact/"+c.contact_id);
                  alert(JSON.stringify(d.data?.inquiries?.map(i=>i.object?.titel+"  ("+i.status+")"),null,2));
                }catch(e){alert(e.message);}
              }} style={{background:"none",border:"1px solid #e8edf3",borderRadius:6,padding:"4px 10px",fontSize:11,color:"#8a95a8",cursor:"pointer",transition:"all .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="#b8943a";e.currentTarget.style.color="#b8943a"}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="#e8edf3";e.currentTarget.style.color="#8a95a8"}}>
                Historie
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// INSERATE VIEW
function InserateView(){
  const [state,setState]=useState("idle");
  const [data,setData]=useState(null);
  const [filter,setFilter]=useState("alle");
  const [cached,setCached]=useState(false);

  const load=async(force)=>{
    setState("loading");
    try{
      const r=await fetch(force?"/api/listings?refresh=1":"/api/listings");
      const d=await r.json();
      if(!d.success)throw new Error(d.error);
      setData(d); setCached(d.cached||false); setState("done");
    }catch(e){setState("error:"+e.message);}
  };

  const portale=[
    {id:"IS24",label:"ImmobilienScout24",color:"#003da5",light:"#e8eef9"},
    {id:"Immowelt",label:"Immowelt",color:"#e8000d",light:"#fde8e9"},
    {id:"Kleinanzeigen",label:"Kleinanzeigen",color:"#d48f00",light:"#fef6e0"},
  ];
  const katLabels={EFH:"Einfamilienhaus",ETW:"Eigentumswohnung",MFH:"Mehrfamilienhaus",Anlage:"Anlageobjekt",Gewerbe:"Gewerbe"};
  const katIcons={EFH:"🏠",ETW:"🏢",MFH:"🏘️",Anlage:"📈",Gewerbe:"🏭"};
  const filterOpts=["alle","EFH","ETW","MFH","Anlage","Gewerbe"];
  const filtered=(l)=>filter==="alle"?l:l.filter(x=>x.kategorie===filter);
  const isNew=(l)=>data&&Array.isArray(data.newIds)&&data.newIds.includes(l.id||l.url);

  return(
    <div>
      <SH title="Inserate Hamm" sub="Aktuelle Angebote von ImmobilienScout24, Immowelt und Kleinanzeigen"/>

      {state==="idle"&&(
        <Card s={{textAlign:"center",padding:"48px 24px"}}>
          <div style={{fontSize:40,marginBottom:16}}>🏘️</div>
          <div style={{fontSize:15,fontWeight:600,color:"#1a1d2e",marginBottom:8}}>Aktuelle Inserate laden</div>
          <div style={{fontSize:13,color:"#8a95a8",marginBottom:24}}>Sucht auf IS24, Immowelt und Kleinanzeigen in Hamm</div>
          <button className="btn-primary" onClick={()=>load(false)} style={{padding:"12px 32px"}}>🔍 Inserate abrufen</button>
        </Card>
      )}

      {state==="loading"&&(
        <Card s={{textAlign:"center",padding:"48px 24px"}}>
          <Spin s={32}/>
          <div style={{fontSize:14,color:"#8a95a8",marginTop:16}}>Suche auf IS24, Immowelt und Kleinanzeigen…</div>
          <div style={{fontSize:12,color:"#b0b8c8",marginTop:6}}>Kann 30–60 Sekunden dauern</div>
        </Card>
      )}

      {state.startsWith("error:")&&(
        <Card s={{textAlign:"center",padding:"40px 24px"}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:14,color:"#dc2626",marginBottom:16}}>{state.replace("error:","")}</div>
          <button className="btn-primary" onClick={()=>load(false)}>Erneut versuchen</button>
        </Card>
      )}

      {state==="done"&&data&&(
        <div style={{display:"flex",flexDirection:"column",gap:20}}>

          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
            {[
              {label:"Gesamt",val:data.total,icon:"📋"},
              {label:"Davon neu",val:data.newCount,icon:"✨"},
              {label:"Portale",val:3,icon:"🔍"},
              {label:"Stand",val:cached?"Cache":"Aktuell",icon:"🕐"},
            ].map(s=>(
              <Card key={s.label} s={{padding:"14px",textAlign:"center"}}>
                <div style={{fontSize:18,marginBottom:4}}>{s.icon}</div>
                <div style={{fontSize:typeof s.val==="number"?22:13,fontWeight:700,color:"#b8943a"}}>{s.val}</div>
                <div style={{fontSize:10,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5,marginTop:2}}>{s.label}</div>
              </Card>
            ))}
          </div>

          {/* Filter + Reload */}
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:600,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.5}}>Filter:</span>
            {filterOpts.map(f=>(
              <button key={f} className={"chip"+(filter===f?" on":"")} onClick={()=>setFilter(f)} style={{fontSize:11}}>
                {f==="alle"?"Alle":(katIcons[f]+" "+katLabels[f])}
              </button>
            ))}
            <button onClick={()=>load(true)} style={{marginLeft:"auto",background:"none",border:"1px solid #e8edf3",borderRadius:8,padding:"6px 14px",fontSize:11,color:"#8a95a8",cursor:"pointer",transition:"all .2s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#b8943a";e.currentTarget.style.color="#b8943a"}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#e8edf3";e.currentTarget.style.color="#8a95a8"}}>🔄 Neu laden</button>
          </div>

          {/* Portal Tabellen */}
          {portale.map(portal=>{
            const items=filtered(data.listings||[]).filter(l=>l.quelle===portal.id);
            if(!items.length)return null;
            return(
              <div key={portal.id} style={{borderRadius:12,overflow:"hidden",border:"1px solid #e8edf3",boxShadow:"0 2px 12px rgba(0,0,0,0.05)"}}>
                {/* Portal Header */}
                <div style={{background:portal.color,padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:"#fff",fontWeight:700,fontSize:15,letterSpacing:"-.3px"}}>{portal.label}</span>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{background:"rgba(255,255,255,0.15)",color:"#fff",fontSize:11,padding:"3px 10px",borderRadius:10}}>
                      {items.filter(l=>isNew(l)).length} neu
                    </span>
                    <span style={{background:"rgba(255,255,255,0.3)",color:"#fff",fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:10}}>
                      {items.length} gesamt
                    </span>
                  </div>
                </div>

                {/* Tabellenkopf */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 130px 110px 90px",background:"#f4f5f7",padding:"9px 16px",borderBottom:"2px solid "+portal.color}}>
                  {["Objekt & Lage","Preis","Größe","Link"].map(h=>(
                    <div key={h} style={{fontSize:10,fontWeight:700,color:"#8a95a8",textTransform:"uppercase",letterSpacing:.8}}>{h}</div>
                  ))}
                </div>

                {/* Zeilen */}
                {items.map((l,i)=>(
                  <div key={l.id||i} style={{display:"grid",gridTemplateColumns:"1fr 130px 110px 90px",padding:"12px 16px",background:i%2===0?"#fff":"#f9fafb",borderBottom:"1px solid #f0f2f5",alignItems:"center",transition:"background .15s"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#fdf8ef"}
                    onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"#fff":"#f9fafb"}>
                    <div>
                      <div style={{marginBottom:5,display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
                        {isNew(l)&&<span style={{background:portal.light,color:portal.color,fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:8,textTransform:"uppercase",letterSpacing:.5}}>✨ NEU</span>}
                        <span style={{background:"#f0f2f5",color:"#64748b",fontSize:10,padding:"1px 7px",borderRadius:8}}>{katIcons[l.kategorie]} {katLabels[l.kategorie]||l.kategorie}</span>
                      </div>
                      <div style={{fontSize:13,fontWeight:600,color:"#1a1d2e",lineHeight:1.4}}>{l.titel}</div>
                      <div style={{fontSize:11,color:"#8a95a8",marginTop:3}}>📍 {l.lage||"Hamm"}</div>
                    </div>
                    <div style={{fontSize:14,fontWeight:700,color:"#1a1d2e"}}>{l.preis}</div>
                    <div style={{fontSize:12,color:"#64748b"}}>{l.groesse||"–"}</div>
                    <div>
                      <a href={l.url} target="_blank" rel="noreferrer"
                        style={{display:"inline-block",background:portal.color,color:"#fff",padding:"6px 12px",borderRadius:6,textDecoration:"none",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>
                        Öffnen →
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            );
          })}

        </div>
      )}
    </div>
  );
}

// APP
const NAV=[{id:"bestand",icon:"🏢",label:"Mein Bestand"},{id:"inserate",icon:"🏘️",label:"Inserate Hamm"},{id:"objekte",icon:"🏠",label:"Objekte"},{id:"anfragen",icon:"📩",label:"Anfragen"},{id:"markt",icon:"📊",label:"Markt"},{id:"kommunikation",icon:"✉️",label:"Kommunikation"},{id:"buero",icon:"📅",label:"Büro"},{id:"recht",icon:"⚖️",label:"Recht & Beratung"},{id:"sparring",icon:"⚔️",label:"Sparring"}];

function App(){
  const [page,setPage]=useState("objekte");
  const [open,setOpen]=useState(true);
  return<div style={{display:"flex",minHeight:"100vh",background:"#f4f5f7"}}>
    <div style={{width:open?220:64,background:"#fff",borderRight:"1px solid #e8edf3",display:"flex",flexDirection:"column",transition:"width .2s",flexShrink:0,position:"sticky",top:0,height:"100vh",overflowY:"auto"}}>
      <div style={{padding:"20px 16px 16px",borderBottom:"1px solid #f0f2f5"}}>
        {open?<div><div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700,color:"#b8943a"}}>Zoeger</div><div style={{fontSize:11,color:"#8a95a8"}}>Immobilien · KI-Agent</div></div>
        :<div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:"#b8943a",textAlign:"center"}}>Z</div>}
      </div>
      <div style={{flex:1,padding:"12px 8px"}}>
        {NAV.map(n=><div key={n.id} className={`nav-item${page===n.id?" active":""}`} onClick={()=>setPage(n.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px",marginBottom:2,color:page===n.id?"#8a6820":"#4a5568"}}>
          <span style={{fontSize:16,flexShrink:0}}>{n.icon}</span>
          {open&&<span style={{fontSize:13,fontWeight:page===n.id?600:400,whiteSpace:"nowrap"}}>{n.label}</span>}
        </div>)}
      </div>
      <div style={{padding:"12px 8px",borderTop:"1px solid #f0f2f5"}}>
        {open&&<div style={{fontSize:10,color:"#b0b8c8",padding:"4px 10px",lineHeight:1.4}}>{TODAY}</div>}
      </div>
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
      <div style={{background:"#fff",borderBottom:"1px solid #e8edf3",padding:"0 24px",height:52,display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:50}}>
        <button onClick={()=>setOpen(!open)} style={{background:"none",border:"none",cursor:"pointer",color:"#8a95a8",fontSize:18,borderRadius:6}}>☰</button>
        <span style={{fontSize:14,fontWeight:600}}>{NAV.find(n=>n.id===page)?.label}</span>
      </div>
      <div style={{flex:1,padding:"28px 28px 60px",overflowY:"auto"}}>
        {page==="objekte"&&<ObjekteView/>}
        {page==="anfragen"&&<AnfragenView/>}
        {page==="markt"&&<MarktView/>}
        {page==="kommunikation"&&<KommunikationView/>}
        {page==="buero"&&<BueroView/>}
        {page==="recht"&&<RechtView/>}
        {page==="sparring"&&<SparringView/>}
        {page==="inserate"&&<InserateView/>}
        {page==="bestand"&&<MeinBestandView/>}
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
